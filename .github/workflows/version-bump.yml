name: Version bump

on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part to bump
        type: choice
        options: [major, minor]
        required: true

permissions:
  contents: write
  actions: write # to dispatch the Release workflow after pushing

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump VERSION
        run: |
          IFS=. read -r MAJOR MINOR < VERSION
          if [ "${{ inputs.part }}" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0
          else
            MINOR=$((MINOR + 1))
          fi
          echo "${MAJOR}.${MINOR}" > VERSION
          echo "New base version: ${MAJOR}.${MINOR}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump ${{ inputs.part }} version to $(cat VERSION)"
          git push
      # A bot push with GITHUB_TOKEN does not trigger Release on its own, so dispatch it explicitly.
      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref master
