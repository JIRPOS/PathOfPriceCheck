name: Pages

# The site is rebuilt when a document it publishes changes, and again after every release —
# the download buttons name the release assets, and those carry the version, so there is no
# fixed `releases/latest/download/...` URL that could have been linked instead.
on:
  push:
    branches: [master]
    paths:
      - '*.md'
      - '!CLAUDE.md' # the agent brief is not published
      - 'LICENSE'
      - 'site/**'
      - 'assets/popc_icon.*'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

# Only `deploy` may write a deployment or mint an OIDC token; `build` just renders markdown.
permissions:
  contents: read

# Deployments serialise; a queued one must wait rather than be dropped, or a release could
# publish the site as it stood before its own assets existed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
